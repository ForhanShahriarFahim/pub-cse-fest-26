<style>
/* Layout: problem index rail on the left; on the right the HackerRank form itself (label column + field column), so each row maps to one box on the HackerRank page. Stacks on phones. */
:root {
  --bg: #f4f5f9;
  --surface: #ffffff;
  --ink: #1a1f31;
  --muted: #5b6277;
  --line: #dde1eb;
  --accent: #2747c9;
  --accent-ink: #ffffff;
  --code-bg: #f1f3f9;
  --ok: #17794b;
  --ok-bg: #e2f3e9;
  --wait: #8a5a00;
  --wait-bg: #fbf0d9;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131d; --surface: #181c29; --ink: #e6e8f1; --muted: #9ba2b9; --line: #2a3044;
    --accent: #8aa2ff; --accent-ink: #0c0f1c; --code-bg: #131725; --ok: #63d39d; --ok-bg: #14301f;
    --wait: #f0b85c; --wait-bg: #33270f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131d; --surface: #181c29; --ink: #e6e8f1; --muted: #9ba2b9; --line: #2a3044;
  --accent: #8aa2ff; --accent-ink: #0c0f1c; --code-bg: #131725; --ok: #63d39d; --ok-bg: #14301f;
  --wait: #f0b85c; --wait-bg: #33270f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
a { color: var(--accent); }
button, .btn { font: 500 13px/1 var(--font-body); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 48px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
.top h1 { font: 700 26px/1.15 var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.top p { margin: 0; color: var(--muted); font-size: 13px; }
.top code { font-family: var(--font-mono); font-size: 12px; }

.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 4px; }
.rail .cap { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px 10px; }
.pick { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center; text-align: left; width: 100%;
  background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 9px 10px; color: var(--ink); cursor: pointer; }
.pick:hover { background: var(--surface); border-color: var(--line); }
.pick[aria-current="true"] { background: var(--surface); border-color: var(--accent); }
.pick .num { font: 500 13px/1 var(--font-mono); display: flex; align-items: center; gap: 6px; grid-row: span 2; }
.pick .nm { font-weight: 600; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.pick .sub { font-size: 12px; color: var(--muted); line-height: 1.3; }
.balloon { width: 11px; height: 14px; border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%; border: 1px solid rgba(0,0,0,.25); flex: none; }

.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.wait { color: var(--wait); background: var(--wait-bg); }

main { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.phead { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.phead h2 { margin: 0; font: 700 24px/1.2 var(--font-display); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; text-wrap: balance; }
.phead h2 .no { font: 500 15px/1 var(--font-mono); color: var(--muted); }
.phead .tier { color: var(--muted); font-size: 14px; margin-top: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 8px; text-decoration: none; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.sect h3 { font: 600 13px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.form { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.row { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 8px 20px; padding: 16px 20px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.label { font-weight: 600; padding-top: 6px; }
.label small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.label small.over { color: #c2261b; font-weight: 600; }
.field { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.note { font-size: 13px; color: var(--ink); background: var(--wait-bg); border-radius: 8px; padding: 9px 12px; }
.note p { margin: 0; }
.box { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.bar .kind { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.copy { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 7px 14px; cursor: pointer; min-width: 78px; }
.copy.done { background: var(--ok); border-color: var(--ok); color: var(--surface); }
pre { margin: 0; padding: 12px; font: 13px/1.55 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }

.prose { font-size: 14px; }
.prose p { margin: 0 0 8px; }
.prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.prose code, .note code { font-family: var(--font-mono); font-size: 12.5px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
td.src { font-family: var(--font-mono); font-size: 12px; white-space: normal; }
figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
figure img { border: 1px solid var(--line); border-radius: 8px; background: #fff; max-width: 100%; height: auto; align-self: flex-start; }
figcaption { font-size: 13px; color: var(--muted); }
details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { font-family: var(--font-mono); font-size: 13px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .rail .cap { grid-column: 1 / -1; }
  .row { grid-template-columns: minmax(0, 1fr); }
  .label { padding-top: 0; }
  .split { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

"name": "Problem Statement", "note": "", "text": "PUB CSE Fest-26 is just around the corner! The organizing committee of\nPUB CSE has promised that **everyone** involved in the programming contest\nwill get one fest T-shirt.\n\nThis year there are **N** teams, and every team has exactly **3** members.\nThere are also **V** volunteers and **J** judges. Each contestant, volunteer and\njudge gets exactly one T-shirt.\n\nThe supplier does not sell single T-shirts. T-shirts come only in packs of\n**K**, and each pack costs **C** taka. The committee wants to buy the **minimum\nnumber of packs** so that there is at least one T-shirt for every person\n(leftover T-shirts are fine).\n\nFor each scenario, find the number of packs the committee must buy and the\ntotal cost in taka."}, {"name": "Input Format", "note": "", "text": "The first line contains an integer **T**, the number of scenarios.\n\nEach of the next **T** lines contains five space-separated integers **N V J K C**."}, {"name": "Constraints", "note": "", "text": "- 1 ≤ T ≤ 10⁴\n- 1 ≤ N ≤ 10⁹\n- 0 ≤ V, J ≤ 10⁹\n- 1 ≤ K ≤ 10⁹\n- 1 ≤ C ≤ 10⁹"}, {"name": "Output Format", "note": "", "text": "For each scenario, print one line with two space-separated integers: the minimum\nnumber of packs and the total cost in taka."}, {"name": "Tags", "note": "", "text": "Math, Implementation, Giveaway"}], "testsNote": "- Upload `tests.zip` (8 test cases).\n- Mark **test case 0** as **Sample**.\n- Explanation for test case 0:", "explanation": "- **Scenario 1:** 2 teams have 6 contestants. With 3 volunteers and 2 judges,\n  11 people need T-shirts. Two packs of 5 give only 10 T-shirts, so 3 packs are\n  needed, costing 3 × 120 = 360 taka.\n- **Scenario 2:** 10 teams have 30 contestants, and there are no volunteers or\n  judges. Four packs of 7 give only 28 T-shirts, so 5 packs are needed, costing\n  5 × 450 = 2250 taka.\n- **Scenario 3:** 3 + 1 + 1 = 5 people, and one pack of 5 is exactly enough.", "settings": "- Languages: C, C++, Java, Python 3\n- Time and memory limit: keep HackerRank's defaults (C/C++ 2 s, Java 8 4 s, Python 3 longer).\n  The reference solutions in every language finish each test in under 0.3 s.\n- Scoring: binary (all or nothing)", "tests": [{"id": "00", "source": "file sample.txt", "bytes": 40}, {"id": "01", "source": "gen edge 1", "bytes": 396}, {"id": "02", "source": "gen random 2 10", "bytes": 353}, {"id": "03", "source": "gen random 3 10000", "bytes": 295658}, {"id": "04", "source": "gen divisible 4 10000", "bytes": 332227}, {"id": "05", "source": "gen big 5 10000", "bytes": 438950}, {"id": "06", "source": "gen floatkill 6 10000", "bytes": 424963}, {"id": "07", "source": "gen max 7 10000", "bytes": 460006}], "sampleIn": "3\n2 3 2 5 120\n10 0 0 7 450\n1 1 1 5 1000\n", "sampleOut": "3 360\n5 2250\n1 1000\n", "images": [], "editorial": "# Editorial: Fest T-Shirts (Giveaway)\n\n**Idea.** The number of people is P = 3N + V + J. We need the smallest number of\npacks `x` with `x * K >= P`, which is the ceiling of P / K. The answer is\n`x` and `x * C`.\n\n**Integer ceiling without floating point:** `x = (P + K - 1) / K`.\n\n**Traps (each one is caught by the official tests):**\n\n| Mistake | Why it fails |\n|---|---|\n| Using `int` | P can be up to 5·10⁹, and the cost up to 5·10¹⁸. Use `long long` (C/C++) or `long` (Java). It still fits, since 5·10¹⁸ < 9.22·10¹⁸. |\n| Computing `packs * C` in `int` | Even 3 packs × 10⁹ taka overflows 32-bit. |\n| `P / K` (floor) | It buys too few packs when K does not divide P. |\n| `P / K + 1` | It buys one pack too many when K divides P (Sample 3). |\n| `ceil((float)P / K)` | `float` has only 24 bits of precision. `double` happens to be exact here, but integer arithmetic is the safe habit. |\n| Forgetting that a team has 3 members | Sample 1 already catches this. |\n\n**Complexity:** O(1) per scenario, O(T) overall.\n", "zipUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/raw/claude/wizardly-planck-f21sjz/problems/02-fest-tshirts **S**."}, {"name": "Constraints", "note": "", "text": "- 1 ≤ T ≤ 1000\n- 1 ≤ length of S ≤ 20\n- S consists of printable ASCII characters and contains **no spaces**."}, {"name": "Output Format", "note": "", "text": "For each ID, print `VALID` if it follows all the rules, otherwise print `INVALID`\n(in uppercase, exactly as shown). Print each answer on its own line."}, {"name": "Tags", "note": "", "text": "Strings, Implementation, Giveaway"}], "testsNote": "- Upload `tests.zip` (6 test cases).\n- Mark **test case 0** as **Sample**.\n- Explanation for test case 0:", "explanation": "- `CSE-26-1042` follows all five rules.\n- `cse-26-1042` is invalid because `CSE` must be uppercase (rule 2).\n- `CSE-19-0420` is invalid because batch 19 is outside 20 to 26 (rule 4).\n- `CSE-24-0000` is invalid because the last four digits are `0000` (rule 5).\n- `CSE-22-12345` has 12 characters (rule 1).\n- `CSE-20-0001` is valid: batch 20 is allowed, and `0001` is not `0000`.", "settings": "- Languages: C, C++, Java, Python 3\n- Time and memory limit: keep HackerRank's defaults (C/C++ 2 s, Java 8 4 s, Python 3 longer).\n  The reference solutions in every language finish each test in under 0.3 s.\n- Scoring: binary (all or nothing)", "tests": [{"id": "00", "source": "file sample.txt", "bytes": 75}, {"id": "01", "source": "gen edge 1", "bytes": 671}, {"id": "02", "source": "gen random 2 20", "bytes": 231}, {"id": "03", "source": "gen random 3 1000", "bytes": 11966}, {"id": "04", "source": "gen random 4 1000", "bytes": 12014}, {"id": "05", "source": "gen valid 5 1000", "bytes": 12005}], "sampleIn": "6\nCSE-26-1042\ncse-26-1042\nCSE-19-0420\nCSE-24-0000\nCSE-22-12345\nCSE-20-0001\n", "sampleOut": "VALID\nINVALID\nINVALID\nINVALID\nINVALID\nVALID\n", "images": [], "editorial": "# Editorial: Fest ID Checker (Giveaway)\n\n**Idea.** Read each ID as a string and check the five rules one by one, in the\norder they are written. Check the **length first**, because every other rule\nuses fixed positions (indices 0 to 10 in 0-based indexing).\n\n```\nlength == 11\ns[0..2] == \"CSE\"\ns[3] == '-' and s[6] == '-'\ns[4], s[5], s[7], s[8], s[9], s[10] are all digits\n20 <= (s[4]-'0')*10 + (s[5]-'0') <= 26\ns[7..10] != \"0000\"\n```\n\n**Traps (each one is caught by the official tests):**\n\n| Mistake | Example that catches it |\n|---|---|\n| Not checking that the length is exactly 11 | `CSE-22-12345` (sample) |\n| Comparing `CSE` case-insensitively | `cse-26-1042` (sample) |\n| Off-by-one on the year range (`<` vs `<=`) | `CSE-19-...`, `CSE-26-...` |\n| Forgetting the `0000` rule | `CSE-24-0000` (sample) |\n| Not checking the hyphens | `CSE_23_1234` |\n| Checking digits only in the serial, not in the year | `CSE-1:-1234`: `':' - '0'` is 10, so the \"year\" becomes 20 and passes the range check |\n| Reading characters past the end of a short string | `C`, `CSE-` (in C/C++ this is undefined behaviour; check the length first) |\n\n**Complexity:** O(|S|) per ID.\n", "zipUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/raw/claude/wizardly-planck-f21sjz/problems/03-fest-id-checker/tests.zip", "folderUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/tree/claude/wizardly-planck-f21sjz/problems/03-fest-id-checker", "solutions": {"sol.c": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/03-fest-id-checker/sol.c", "sol.cpp": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/03-fest-id-checker/sol.cpp", "Solution.java": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/03-fest-id-checker/Solution.java", "sol.py": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/03-fest-id-checker/sol.py"}}, {"num": "04", "slug": "04-lab-robot", "name": "Lab Robot", "tier": "Easy: implementation", "status": "Approved", "fields": [{"name": "Challenge Name", "note": "", "text": "Lab Robot"}, {"name": "Description", "note": "", "text": "Simulate a robot walking through the contest lab and count the cells it visits."}, {"name": "Problem Statement", "note": "Before you paste: put the cursor on the `![...]` line, click the **image** button\nin the editor toolbar, and upload `sample.png` from this folder. Then delete the\nplaceholder line.", "text": "During PUB CSE Fest-26, the robotics club lends the contest hall a small robot\nnamed **Robu**, which carries water bottles to the teams.\n\nThe contest lab is a grid of **N** rows and **M** columns. Rows are numbered\n1 to N from **top** to **bottom**, and columns 1 to M from **left** to\n**right**. Each cell is one of:\n\n- `.`: free floor\n- `#`: a computer desk, which Robu cannot enter\n- `S`: free floor where Robu starts (there is exactly one `S`)\n\nRobu receives a string of **K** commands, one character each:\n`U` (up one row), `D` (down one row), `L` (left one column), `R` (right one column).\n\nRobu executes the commands **in order**. If a command would move it **outside the\nlab** or **into a desk**, Robu ignores that command and stays where it is, then\ncontinues with the next command.\n\nAfter all commands are done, report:\n\n1. Robu's final position (row and column), and\n2. how many **different** cells Robu has stood on, **including the starting cell**.\n\nThe picture below shows Robu's walk for Sample Input 0. A red bar with a ✕ inside\nRobu's cell marks a command that was ignored, because that move would leave the\nlab or enter a desk.\n\n![Robu's walk in Sample Input 0](UPLOAD sample.png HERE)"}, {"name": "Input Format", "note": "", "text": "- The first line contains two integers **N** and **M**.\n- Each of the next **N** lines contains a string of **M** characters describing\n  one row of the lab, from row 1 to row N.\n- The next line contains an integer **K**.\n- The last line contains a string of **K** characters, the commands."}, {"name": "Constraints", "note": "", "text": "- 1 ≤ N, M ≤ 100\n- Each grid character is `.`, `#` or `S`, and there is exactly one `S`.\n- 1 ≤ K ≤ 10⁵\n- Each command is `U`, `D`, `L` or `R`."}, {"name": "Output Format", "note": "", "text": "Print two lines:\n\n- The first line contains two integers: Robu's final row and column.\n- The second line contains one integer: the number of different cells Robu has stood on."}, {"name": "Tags", "note": "", "text": "Implementation, Simulation, Grid"}], "testsNote": "- Upload `tests.zip` (13 test cases).\n- Mark **test case 0** as **Sample**.\n- Explanation for test case 0:", "explanation": "Robu starts at (1, 1).\n\n- `U` is ignored, because it would leave the lab.\n- `R R` moves it to (1, 3). The next `R` is ignored, because (1, 4) is a desk.\n- `D D` moves it to (3, 3), and `R R` to (3, 5).\n- `U` moves it to (2, 5), and `D D` moves it back through (3, 5) to (4, 5).\n- The final `L` is ignored, because (4, 4) is a desk.\n\nRobu ends at row 4, column 5. The cells it stood on are (1,1), (1,2), (1,3),\n(2,3), (3,3), (3,4), (3,5), (2,5) and (4,5). That is **9** different cells;\n(3, 5) was visited twice but is counted once.", "settings": "- Languages: C, C++, Java, Python 3\n- Time and memory limit: keep HackerRank's defaults (C/C++ 2 s, Java 8 4 s, Python 3 longer).\n  The reference solutions in every language finish each test in under 0.3 s.\n- Scoring: binary (all or nothing)", "tests": [{"id": "00", "source": "file sample.txt", "bytes": 60}, {"id": "01", "source": "gen one 1 50", "bytes": 60}, {"id": "02", "source": "gen line 2 1 100 1000", "bytes": 1113}, {"id": "03", "source": "gen line 3 100 1 1000", "bytes": 1212}, {"id": "04", "source": "gen boxed 4 10 10 500", "bytes": 621}, {"id": "05", "source": "gen random 5 8 8 60 20", "bytes": 140}, {"id": "06", "source": "gen random 6 30 40 2000 25", "bytes": 3242}, {"id": "07", "source": "gen random 7 100 100 100000 0", "bytes": 110116}, {"id": "08", "source": "gen random 8 100 100 100000 20", "bytes": 110116}, {"id": pUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/raw/claude/wizardly-planck-f21sjz/problems/04-lab-robot/tests.zip", "folderUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/tree/claude/wizardly-planck-f21sjz/problems/04-lab-robot", "solutions": {"sol.c": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/04-lab-robot/sol.c", "sol.cpp": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/04-lab-robot/sol.cpp", "Solution.java": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/04-lab-robot/Solution.java", "sol.py": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/04-lab-robot/sol.py"}}, {"num": "05", "slug": "05-fest-scoreboard", "name": "Fest Scoreboard", "tier": "Easy: implementation", "status": "Approved", "fields": [{"name": "Challenge Name", "note": "", "text": "Fest Scoreboard"}, {"name": "Description", "note": "", "text": "Rebuild the ICPC scoreboard of PUB CSE Fest-26 from the submission log and find the winner."}, {"name": "Problem Statement", "note": "", "text": "Ten minutes before the end of **PUB CSE Fest-26**, the scoreboard screen crashed!\nLuckily, the judges still have the submission log. Help them rebuild the scoreboard.\n\nThere are **T** teams, numbered 1 to T, and **P** problems, labelled with the first\nP uppercase letters (`A`, `B`, `C`, ...). The log lists **N** submissions in the\norder they were judged. Each submission has the minute it was made, the team, the\nproblem and the verdict, which is one of:\n\n- `AC`: accepted\n- `WA` (wrong answer), `TLE` (time limit exceeded), `RE` (runtime error): **rejected**\n- `CE`: compile error\n\nThe scoreboard follows these ICPC rules:\n\n1. A team **solves** a problem with its **first** `AC` on that problem. Every later\n   submission by that team on that problem is ignored.\n2. The **penalty** for a solved problem is the minute of that first `AC`, plus\n   **20** minutes for every **rejected** submission (`WA`, `TLE` or `RE`) the team\n   made on that problem **before** that `AC`.\n3. A `CE` submission never adds penalty.\n4. Rejected submissions on a problem that the team **never solves** add no penalty.\n\nA team's **total penalty** is the sum of the penalties of the problems it solved.\n\nThe **winner** is the team that solved the most problems. If several teams solved\nthe same number of problems, the one with the smaller total penalty wins. If they\nare still tied, the team with the smaller team number wins.\n\nFor every team, find the number of problems it solved and its total penalty, and\nthen find the winner."}, {"name": "Input Format", "note": "", "text": "- The first line contains three integers **T**, **P** and **N**.\n- Each of the next **N** lines describes one submission with four values separated\n  by spaces: the **minute**, the **team** number, the **problem** letter and the\n  **verdict**.\n\nThe submissions are given in the order they were judged."}, {"name": "Constraints", "note": "", "text": "- 1 ≤ T ≤ 100\n- 1 ≤ P ≤ 26\n- 0 ≤ N ≤ 10⁵\n- 0 ≤ minute ≤ 300, and the minutes never decrease from one line to the next\n  (several submissions can share the same minute)\n- 1 ≤ team ≤ T\n- The problem letter is one of the first P uppercase letters.\n- The verdict is one of `AC`, `WA`, `TLE`, `RE`, `CE`."}, {"name": "Output Format", "note": "", "text": "Print **T + 1** lines:\n\n- Line i (for i = 1 to T): two integers, the number of problems team i solved and\n  its total penalty.\n- The last line: the team number of the winner."}, {"name": "Tags", "note": "", "text": "Implementation, Simulation, Arrays"}], "testsNote": "- Upload `tests.zip` (12 test cases).\n- Mark **test case 0** as **Sample**.\n- Explanation for test case 0:", "explanation": "- **Team 1:** on problem A, one `WA` (minute 5) and then `AC` at minute 12, so\n  12 + 20 = 32. The `WA` at minute 40 comes after the `AC`, so it is ignored.\n  On problem B, one `TLE` and then `AC` at minute 58, so 58 + 20 = 78.\n  Team 1 solved **2** problems with penalty 32 + 78 = **110**.\n- **Team 2:** on problem A, the `CE` adds nothing and the `AC` is at minute 20, so 20.\n  On problem C, one `WA` and then `AC` at minute 52, so 52 + 20 = 72.\n  Team 2 solved **2** problems with penalty 20 + 72 = **92**.\n- **Team 3:** one `WA` on problem B but never solved it, so **0** problems and\n  penalty **0**.\n\nTeams 1 and 2 both solved 2 problems, and team 2 has the smaller penalty\n(92 < 110), so the winner is team **2**.", "settings": "- Languages: C, C++, Java, Python 3\n- Time and memory limit: keep HackerRank's defaults (C/C++ 2 s, Java 8 4 s, Python 3 longer).\n  The reference solutions in every language finish each test in under 0.3 s.\n- Scoring: binary (all or nothing)", "tests": [{"id": "00", "source": "file sample.txt", "bytes": 107}, {"id": "01", "source": "gen empty 1 5 3", "bytes": 6}, {"id": "02", "source": "gen edge 2", "bytes": 208}, {"id": "03", "source": "gen nosolve 3 7 5 40", "bytes": 438}, {"id": "04", "source": "gen tie 4 10 5", "bytes": 795}, {"id": "05", "source": "gen tie 5 100 26", "bytes": 8205}, {"id": "06", "source": "gen random 6 8 5 200", "bytes": 2156}, {"id": "07", "source": "gen ce 7 20 8 3000", "bytes": 33715}, {"id": "08", "source": "gen realistic 8 20 10 2000", "bytes": 22621}, {"id": "09", "source": "gen realistic 9 100 26 100000", "bytes": 1169618}, {"id": "10", "source": "gen random 10 100 26 100000", "bytes": 1165780}, {"id": "11", "source": "gen realistic 11 1 1 500", "bytes": 5422}], "sampleIn": "3 3 10\n5 1 A WA\n12 1 A AC\n15 2 A CE\n20 2 A AC\n25 3 B WA\n31 1 B TLE\n40 1 A WA\n45 2 C WA\n52 2 C AC\n58 1 B AC\n", "sampleOut": "2 110\n2 92\n0 0\n2\n", "images": [], "editorial": "# Editorial: Fest Scoreboard (Easy, implementation)\n\n**Idea.** Keep two small tables indexed by `[team][problem]`:\n\n- `acTime[team][prob]`: the minute of the first `AC`, or -1 while unsolved.\n- `rejected[team][prob]`: the number of `WA`/`TLE`/`RE` before that first `AC`.\n\nProcess the log in order:\n\n```\nif acTime[team][prob] != -1: skip              # already solved, ignore\nelse if verdict == AC:  acTime[team][prob] = minute\nelse if verdict != CE:  rejected[team][prob] += 1\n```\n\nThen, for each team, add up `acTime + 20 * rejected` over its solved problems.\nFind the winner with one scan: switch to team i only if it solved **more**, or the\n**same** number with a **strictly smaller** penalty. Starting from team 1 and using a\nstrict `<` keeps the smaller team number on a full tie.\n\n**Traps (each one is caught by the official tests):**\n\n| Mistake | Why it is wrong |\n|---|---|\n| Counting `WA` after the first `AC` | Rule 1: later submissions are ignored. |\n| Counting `CE` as rejected | Rule 3. |\n| Adding 20 per wrong try on unsolved problems | Rule 4. |\n| A second `AC` counts the problem again | Only the first `AC` solves it. |\n| Adding 20 once instead of 20 × (number of tries) | Rule 2. |\n| One wrong-try counter per team instead of per problem | Tries on problem A must not affect problem B. |\n| Using the time of the first submission instead of the `AC` time | Rule 2. |\n| `<=` in the winner check | On a full tie the **smaller** team number must win. |\n| Ignoring penalty when picking the winner | Equal solves are broken by penalty. |\n\n**Complexity:** O(N + T·P) time, O(T·P) memory. The penalty is at most about 2·10⁶, so `int` is enough.\n", "zipUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/raw/claude/wizardly-planck-f21sjz/problems/05-fest-scoreboard/tests.zip", "folderUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/tree/claude/wizardly-planck-f21sjz/problems/05-fest-scoreboard", "solutions": {"sol.c": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/05-fest-scoreboard/sol.c", "sol.cpp": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/05-fest-scoreboard/sol.cpp", "Solution.java": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/05-fest-scoreboard/Solution.java", "sol.py": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/05-fest-scoreboard/sol.py"}}, {"num": "06", "slug": "06-love-letter", "name": "Love Letter", "tier": "Easy: strings, Caesar cipher", "status": "Approved", "fields": [{"name": "Challenge Name", "note": "", "text": "Love Letter"}, {"name": "Description", "note": "", "text": "Find the secret key and decrypt the love letters of a shy PUB CSE student."}, {"name": "Problem Statement", "note": "Before you paste: put the cursor on the `![...]` line, click the **image** button\nin the editor toolbar, and upload `alphabet.png` from this folder. Then delete the\nplaceholder line.", "text": "Every evening during **PUB CSE Fest-26**, a shy student drops a secret love letter\ninto the notice box of the CSE department. The whole department wants to know who\nthe lucky one is, but every love letter is **encrypted**!\n\nEach love letter is written as a **string**.\n\nTo encrypt a string, the student picks a secret key **K** (0 ≤ K ≤ 25) and replaces\nevery English letter with the letter that comes **K places later** in the alphabet,\ngoing around from `z` back to `a` (and from `Z` back to `A`):\n\n- Uppercase letters stay uppercase, and lowercase letters stay lowercase.\n- Every other character (spaces, digits, punctuation) stays **unchanged**.\n\nFor example, with K = 3, `a` becomes `d`, `x` becomes `a`, `C` becomes `F`, and\n`I love C++ <3` becomes `L oryh F++ <3`.\n\n![How a shift with K = 3 works](UPLOAD alphabet.png HERE)\n\nThe key can be **different for every string**, and nobody knows it. But the student\nalways signs off the same way: the **last five characters** of every original\nstring are exactly `Coder`.\n\nDecrypt every string and find out who the love letters are written to!"}, {"name": "Input Format", "note": "", "text": "The first line contains an integer **T**, the number of strings.\n\nEach of the next **T** lines contains one encrypted string **S**.\n\nEach string contains spaces, so read the whole line at once."}, {"name": "Constraints", "note": "", "text": "- 1 ≤ T ≤ 100\n- 5 ≤ length of S ≤ 1000\n- S consists of printable ASCII characters. It does not start or end with a space,\n  and it never has two spaces in a row.\n- The original string ends with `Coder`."}, {"name": "Output Format", "note": "", "text": "For each string, print the decrypted (original) string on its own line."}, {"name": "Tags", "note": "", "text": "Strings, Implementation, Cryptography"}], "testsNote": "- Upload `tests.zip` (8 test cases).\n- Mark **test case 0** as **Sample**.\n- Explanation for test case 0:", "explanation": "The first string ends with `Frghu`. The original ends with `Coder`, and `C` → `F`\nis 3 places, so **K = 3**. Moving every letter 3 places back gives\n`My dearest C++, you compile my heart ... Yours forever, Coder`.\nNotice that `C++`, the comma and the full stop keep their symbols.\n\nThe second string ends with `Mynob`. `C` → `M` is 10 places, so K = 10.\n\nThe third string ends with `Bncdq`. `C` → `B` goes around the end of the\nalphabet: C, D, ..., Z, A, B is 25 places, so K = 25.\n\nSo the shy student's love letters were written to programming itself!", "settings": "- Languages: C, C++, Java, Python 3\n- Time and memory limit: keep HackerRank's defaults (C/C++ 2 s, Java 8 4 s, Python 3 longer).\n  The reference solutions in every language finish each test in under 0.3 s.\n- Scoring: binary (all or nothing)", "tests": [{"id": "00", "source": "file sample.txt", "bytes": 232}, {"id": "01", "source": "gen minimal 1", "bytes": 63}, {"id": "02", "source": "gen keys 2", "bytes": 3150}, {"id": "03", "source": "gen letters 3 20", "bytes": 2294}, {"id ry letter K places back, wrapping around the alphabet, and\nleave everything else alone:\n\n```\nif 'a' <= ch <= 'z':  ch = (ch - 'a' - K + 26) % 26 + 'a'\nif 'A' <= ch <= 'Z':  ch = (ch - 'A' - K + 26) % 26 + 'A'\n```\n\n**Reading the input.** Each string contains spaces, so read whole lines:\n`getline` in C++ (after reading T, skip the rest of that first line), `fgets` in C,\n`BufferedReader.readLine()` in Java, `input()` in Python.\n\n**Traps (each one is caught by the official tests):**\n\n| Mistake | Effect |\n|---|---|\n| Shifting forward instead of backward | It encrypts again instead of decrypting. |\n| Subtracting K without wrapping | `a` - 3 becomes `^`, not `x`. |\n| Decrypting only lowercase letters | `C++` stays `F++`. |\n| Printing in all uppercase | The case must be kept. |\n| Treating the symbols between `Z` and `a` in ASCII (`[`, `\\`, `]`, `^`, `_` and the backtick) as letters | Those symbols must not change. |\n| Shifting digits too | Digits must not change. |\n| Using the first string's key for every string | Each string has its own key. |\n| Computing the key as `'C' - c` | The wrong sign: it shifts the wrong way. |\n| Taking the key from the first character | Only the signature `Coder` is known. |\n| `cin >> T` followed by `getline` without skipping the newline | The first string read is empty. |\n\n**Complexity:** O(total length of all strings).\n", "zipUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/raw/claude/wizardly-planck-f21sjz/problems/06-love-letter/tests.zip", "folderUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/tree/claude/wizardly-planck-f21sjz/problems/06-love-letter", "solutions": {"sol.c": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/06-love-letter/sol.c", "sol.cpp": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/06-love-letter/sol.cpp", "Solution.java": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/06-love-letter/Solution.java", "sol.py": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/06-love-letter/sol.py"}}, {"num": "07", "slug": "07-rickshaw-ride", "name": "Rickshaw Ride", "tier": "Easy: sorting, greedy", "status": "Drafted", "fields": [{"name": "Challenge Name", "note": "", "text": "Rickshaw Ride"}, {"name": "Description", "note": "", "text": "Find the minimum number of rickshaws needed to take every student to Satmatha after PUB CSE Fest-26."}, {"name": "Problem Statement", "note": "", "text": "The prize-giving ceremony of **PUB CSE Fest-26** ends late in the evening, and\n**N** students need to get from the campus to Satmatha. A long line of rickshaws\nis waiting at the campus gate.\n\nA rickshaw can carry **one or two** students, and the total weight of the students\non it must **not exceed X** kilograms. The i-th student weighs **wᵢ** kilograms.\nEvery student is light enough to ride alone (wᵢ ≤ X).\n\nEvery student must ride exactly one rickshaw. What is the **minimum number of\nrickshaws** needed to take all **N** students to Satmatha?"}, {"name": "Input Format", "note": "", "text": "The first line contains two space-separated integers **N** and **X**: the number of\nstudents and the weight limit of a rickshaw in kilograms.\n\nThe second line contains **N** space-separated integers: the weights of the students\nin kilograms, **w₁, w₂, ..., wₙ**."}, {"name": "Constraints", "note": "", "text": "- 1 ≤ N ≤ 2 × 10⁵\n- 1 ≤ X ≤ 10⁹\n- 1 ≤ wᵢ ≤ X"}, {"name": "Output Format", "note": "", "text": "Print one integer: the minimum number of rickshaws needed."}, {"name": "Tags", "note": "", "text": "Greedy, Sorting, Two Pointers"}], "testsNote": "- Upload `tests.zip` (18 test cases).\n- Mark **test case 0** as **Sample**.\n- Explanation for test case 0:", "explanation": "A rickshaw can carry at most 150 kg.\n\n- The 100 kg student can share only with th 367729}, {"id": "17", "source": "gen reversed 17 100000 1000000", "bytes": 685380}], "sampleIn": "6 150\n50 90 60 100 75 80\n", "sampleOut": "4\n", "images": [], "editorial": "# Editorial: Rickshaw Ride (Easy)\n\n**Idea.** Sort the weights. Look at the **heaviest** student who has no rickshaw yet.\n\n- If they fit together with the **lightest** remaining student, put both on one rickshaw.\n- Otherwise the heaviest student cannot share with anybody (everyone else is at least\n  as heavy as the lightest), so they ride alone.\n\nEither way one rickshaw leaves, and we repeat with the remaining students. This is\nthe *two pointers* technique: `l` starts at the lightest, `r` at the heaviest.\n\n```\nsort(w)\nl = 0, r = N - 1, answer = 0\nwhile l <= r:\n    if l < r and w[l] + w[r] <= X:   l = l + 1     # lightest joins the heaviest\n    r = r - 1                                      # heaviest leaves\n    answer = answer + 1\n```\n\n**Why is this optimal?** Let H be the heaviest and L the lightest student, with\nH + L ≤ X, and take any best seating.\n\n- If H and L already ride together, we are done.\n- If H rides with Y and L rides with Z, swap Y and L: H + L ≤ X, and\n  Y + Z ≤ Y + H ≤ X (since Z ≤ H). The number of rickshaws does not change.\n- If one of them rides alone, move the other's partner (if any) to ride alone and\n  seat H with L. The count does not get bigger.\n\nSo some best seating puts H with L, and the same argument repeats on the rest.\n\n**Traps (each one is caught by the official tests):**\n\n| Mistake | Why it fails |\n|---|---|\n| Not sorting first | The two pointers only make sense on sorted weights. |\n| Pairing neighbours after sorting, (w₀, w₁), (w₂, w₃), ... | It wastes light students on each other. Sample: it gives 5 instead of 4. |\n| Pairing the two heaviest if they fit | Same problem from the other side. Sample: 5. |\n| `w[l] + w[r] < X` | A pair weighing exactly X is allowed (Sample: 100 + 50 = 150). |\n| `while (l < r)` | The last student const BALLOONS = ["#e53935", "#fb8c00", "#fdd835", "#43a047", "#1e88e5", "#8e24aa",
                  "#ec407a", "#00897b", "#6d4c41", "#546e7a", "#f5f5f5", "#c0a000"];
const KIND = { "Challenge Name": "Plain text", "Description": "Plain text", "Tags": "Plain text" };

const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
// Small renderer for the notes in challenge.md: paragraphs and "- " lists with indented continuations.
function prose(md) {
  const out = []; let list = null, para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push("<ul>" + list.map(li => "<li>" + inline(li) + "</li>").join("") + "</ul>"); list = null; } };
  for (const line of md.split("\n")) {
    if (/^- /.test(line)) { flushPara(); (list = list || []).push(line.slice(2)); }
    else if (/^\s+\S/.test(line) && list) { list[list.length - 1] += " " + line.trim(); }
    else if (!line.trim()) { flushPara(); flushList(); }
    else { flushList(); para.push(line.trim()); }
  }
  flushPara(); flushList();
  return out.join("");
}

const copyTexts = [];
function copyBox(text, kind) {
  const id = copyTexts.push(text) - 1;
  return `<div class="box"><div class="bar"><span class="kind">${esc(kind)}</span>` +
    `<button class="copy" type="button" data-copy="${id}">Copy</button></div><pre>${esc(text) || "&nbsp;"}</pre></div>`;
}

document.addEventListener("click", async e => {
  const btn = e.target.closest("button.copy");
  if (!btn) return;
  const text = copyTexts[+btn.dataset.copy];
  const done = msg => { btn.textContent = msg; btn.classList.add("done");
    setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1600); };
  try {
    await navigator.clipboard.writeText(text);
    done("Copied");
  } catch (err) {
    const pre = btn.closest(".box").querySelector("pre");
    const range = document.createRange(); range.selectNodeContents(pre);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
    done(ok ? "Copied" : "Press Ctrl+C");
  }
});

function statusPill(s) { return `<span class="pill ${s === "Approved" ? "ok" : "wait"}">${esc(s)}</span>`; }
function balloon(i) { return `<span class="balloon" style="background:${BALLOONS[i % BALLOONS.length]}" aria-hidden="true"></span>`; }
function kb(n) { return n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`; }

function render(idx) {
  copyTexts.length = 0;
  const p = DATA.problems[idx];
  document.querySelectorAll(".pick").forEach((b, i) => b.setAttribute("aria-current", i === idx ? "true" : "false"));

  const rows = p.fields.map(f => {
    let hint = "";
    if (f.name === "Description") {
      const n = [...f.text].length;
      hint = `<small class="${n > 140 ? "over" : ""}">${n} / 140 characters</small>`;
    }
    const note = f.note ? `<div class="note">${prose(f.note)}</div>` : "";
    return `<div class="row"><div class="label">${esc(f.name)}${hint}</div>` +
      `<div class="field">${note}${copyBox(f.text, KIND[f.name] || "Markdown")}</div></div>`;
  }).join("");

  const testRows = p.tests.map(t => `<tr><td>${t.id}</td><td>${t.id === "00" ? statusPill("Sample") : "Hidden"}</td>` +
    `<td>${kb(t.bytes)}</td><td class="src">${esc(t.source)}</td></tr>`).join("");

  const pics = p.images.length ? `<section class="sect"><h3>Pictures</h3><div class="card">` +
    p.images.map(im => `<figure><img src="${im.data}" alt="${esc(im.name)}"><figcaption><code>${esc(im.name)}</code>: upload it with the editor's image button where the Problem Statement says <code>UPLOAD ${esc(im.name)} HERE</code>. Right-click the picture and choose "Save image as", or get it from the <a href="${p.folderUrl}" target="_blank" rel="noopener">problem folder</a>.</figcaption></figure>`).join("") +
    `</div></section>` : "";

  const sols = Object.entries(p.solutions).map(([f, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(f)}</a>`).join("");

  document.getElementById("main").innerHTML = `
    <section class="phead">
      <div>
        <h2>${balloon(idx)}<span class="no">${p.num}</span> ${esc(p.name)} ${statusPill(p.status)}</h2>
        <div class="tier">${esc(p.tier)}</div>
      </div>
      <div class="actions">
        <a class="btn primary" href="${p.zipUrl}" target="_blank" rel="noopener">Download tests.zip</a>
        <a class="btn" href="${p.folderUrl}" target="_blank" rel="noopener">Problem folder</a>
      </div>
    </section>

    <section class="sect"><h3>Create Challenge form</h3><div class="form">${rows}</div></section>

    <section class="sect"><h3>Test Cases tab</h3>
      <div class="form">
        <div class="row"><div class="label">Steps</div><div class="field prose">${prose(p.testsNote)}</div></div>
        <div class="row"><div class="label">Test cases<small>${p.tests.length} in tests.zip</small></div>
          <div class="field tablewrap"><table><thead><tr><th>#</th><th>Type</th><th>Input size</th><th>How it was made</th></tr></thead><tbody>${testRows}</tbody></table></div></div>
        <div class="row"><div class="label">Sample preview<small>HackerRank should show exactly this</small></div>
          <div class="field split">
            <div class="box"><div class="bar"><span class="kind">Sample Input 0</span></div><pre>${p.sampleIn ? esc(p.sampleIn) : "(empty: this problem has no input)"}</pre></div>
            <div class="box"><div class="bar"><span class="kind">Sample Output 0</span></div><pre>${esc(p.sampleOut)}</pre></div>
          </div></div>
        <div class="row"><div class="label">Explanation<small>for test case 0</small></div><div class="field">${copyBox(p.explanation, "Markdown")}</div></div>
      </div>
    </section>

    <section class="sect"><h3>Settings</h3><div class="card prose">${prose(p.settings)}</div></section>
    ${pics}
    <section class="sect"><h3>For judges</h3><div class="card">
      <p class="prose" style="margin:0 0 10px">Reference solutions (submit one on HackerRank to confirm the setup): </p>
      <div class="links">${sols}</div>
      <details style="margin-top:14px"><summary>Editorial</summary>${copyBox(p.editorial, "Markdown")}</details>
    </div></section>`;
  try { localStorage.setItem("desk-problem", p.num); } catch (_) {}
  if (location.hash !== "#p" + p.num) history.replaceState(null, "", "#p" + p.num);
}

function start() {
  const rail = document.getElementById("rail");
  DATA.problems.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "pick";
    b.innerHTML = `<span class="num">${balloon(i)}${p.num}</span><span class="nm">${esc(p.name)}</span>` +
      `<span class="sub">${esc(p.tier)} · ${esc(p.status)}</span>`;
    b.addEventListener("click", () => { render(i); window.scrollTo({ top: 0 }); });
    rail.appendChild(b);
  });
  document.getElementById("build").innerHTML =
    `${DATA.problems.length} problems · branch <code>${esc(DATA.branch)}</code> · commit <code>${esc(DATA.commit)}</code>`;
  let want = (location.hash.match(/^#p(\d\d)$/) || [])[1];
  if (!want) { try { want = localStorage.getItem("desk-problem"); } catch (_) {} }
  const idx = Math.max(0, DATA.problems.findIndex(p => p.num === want));
  render(idx);
}
start();
</script>
