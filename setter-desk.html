<style>
/* Layout: problem index rail on the left; on the right the HackerRank form itself (label column + field column), so each row maps to one box on the HackerRank page. Stacks on phones. */
:root {
  --bg: #f4f5f9;
  --surface: #ffffff;
  --ink: #1a1f31;
  --muted: #5b6277;
  --line: #dde1eb;
  --accent: #2747c9;
  --accent-ink: #ffffff;
  --code-bg: #f1f3f9;
  --ok: #17794b;
  --ok-bg: #e2f3e9;
  --wait: #8a5a00;
  --wait-bg: #fbf0d9;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131d; --surface: #181c29; --ink: #e6e8f1; --muted: #9ba2b9; --line: #2a3044;
    --accent: #8aa2ff; --accent-ink: #0c0f1c; --code-bg: #131725; --ok: #63d39d; --ok-bg: #14301f;
    --wait: #f0b85c; --wait-bg: #33270f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131d; --surface: #181c29; --ink: #e6e8f1; --muted: #9ba2b9; --line: #2a3044;
  --accent: #8aa2ff; --accent-ink: #0c0f1c; --code-bg: #131725; --ok: #63d39d; --ok-bg: #14301f;
  --wait: #f0b85c; --wait-bg: #33270f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
a { color: var(--accent); }
button, .btn { font: 500 13px/1 var(--font-body); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 48px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
.top h1 { font: 700 26px/1.15 var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.top p { margin: 0; color: var(--muted); font-size: 13px; }
.top code { font-family: var(--font-mono); font-size: 12px; }

.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 4px; }
.rail .cap { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px 10px; }
.pick { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center; text-align: left; width: 100%;
  background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 9px 10px; color: var(--ink); cursor: pointer; }
.pick:hover { background: var(--surface); border-color: var(--line); }
.pick[aria-current="true"] { background: var(--surface); border-color: var(--accent); }
.pick .num { font: 500 13px/1 var(--font-mono); display: flex; align-items: center; gap: 6px; grid-row: span 2; }
.pick .nm { font-weight: 600; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.pick .sub { font-size: 12px; color: var(--muted); line-height: 1.3; }
.balloon { width: 11px; height: 14px; border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%; border: 1px solid rgba(0,0,0,.25); flex: none; }

.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.wait { color: var(--wait); background: var(--wait-bg); }

main { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.phead { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.phead h2 { margin: 0; font: 700 24px/1.2 var(--font-display); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; text-wrap: balance; }
.phead h2 .no { font: 500 15px/1 var(--font-mono); color: var(--muted); }
.phead .tier { color: var(--muted); font-size: 14px; margin-top: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 8px; text-decoration: none; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.sect h3 { font: 600 13px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.form { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.row { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 8px 20px; padding: 16px 20px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.label { font-weight: 600; padding-top: 6px; }
.label small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.label small.over { color: #c2261b; font-weight: 600; }
.field { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.note { font-size: 13px; color: var(--ink); background: var(--wait-bg); border-radius: 8px; padding: 9px 12px; }
.note p { margin: 0; }
.box { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.bar .kind { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.copy { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 7px 14px; cursor: pointer; min-width: 78px; }
.copy.done { background: var(--ok); border-color: var(--ok); color: var(--surface); }
pre { margin: 0; padding: 12px; font: 13px/1.55 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }

.prose { font-size: 14px; }
.prose p { margin: 0 0 8px; }
.prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.prose code, .note code { font-family: var(--font-mono); font-size: 12.5px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
td.src { font-family: var(--font-mono); font-size: 12px; white-space: normal; }
figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
figure img { border: 1px solid var(--line); border-radius: 8px; background: #fff; max-width: 100%; height: auto; align-self: flex-start; }
figcaption { font-size: 13px; color: var(--muted); }
details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { font-family: var(--font-mono); font-size: 13px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .rail .cap { grid-column: 1 / -1; }
  .row { grid-template-columns: minmax(0, 1fr); }
  .label { padding-top: 0; }
  .split { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const DATA = {"problems": [{"num": "01", "slug": "01-welcome", "name": "Welcome to CSE Fest-26", "tier": "Giveaway: printing", "status": "Drafted", "fields": [{"name": "Challenge Name", "note": "", "text": "Welcome to CSE Fest-26"}, {"name": "Description", "note": "", "text": "Print the two-line welcome message of PUB CSE Fest-26."}, {"name": "Problem Statement", "note": "", "text": "The opening ceremony of **PUB CSE Fest-26** starts in a few minutes, and the\nbig screen in the contest hall needs a welcome message.\n\nWrite a program that prints the following **two lines** exactly as shown:\n\n```\nWelcome to PUB CSE Fest-26!\nCode. Compete. Celebrate.\n```\n\nUppercase and lowercase letters, spaces, the hyphen `-`, the exclamation mark\n`!` and the full stops `.` must all match exactly. Do not print anything else."}, {"name": "Input Format", "note": "", "text": "There is no input for this problem."}, {"name": "Constraints", "note": "", "text": "There are no constraints, because the program reads no input."}, {"name": "Output Format", "note": "", "text": "Print exactly two lines:\n\n- Line 1: `Welcome to PUB CSE Fest-26!`\n- Line 2: `Code. Compete. Celebrate.`"}, {"name": "Tags", "note": "", "text": "Basic Programming, Printing, Giveaway"}], "testsNote": "- Upload `tests.zip` (2 test cases; both have empty input).\n- Mark **test case 0** as **Sample**.\n- Explanation for test case 0:", "explanation": "The program reads nothing and prints the two lines of the welcome message.", "settings": "- Languages: C, C++, Java, Python 3\n- Time and memory limit: keep HackerRank's defaults (C/C++ 2 s, Java 8 4 s, Python 3 longer).\n  The reference solutions in every language finish each test in under 0.3 s.\n- Scoring: binary (all or nothing)", "tests": [{"id": "00", "source": "file sample.txt", "bytes": 0}, {"id": "01", "source": "file sample.txt", "bytes": 0}], "sampleIn": "", "sampleOut": "Welcome to PUB CSE Fest-26!\nCode. Compete. Celebrate.\n", "images": [], "editorial": "# Editorial: Welcome to CSE Fest-26 (Giveaway)\n\n**Idea.** Print the two lines. No input needs to be read.\n\n```c\nprintf(\"Welcome to PUB CSE Fest-26!\\n\");\nprintf(\"Code. Compete. Celebrate.\\n\");\n```\n\nThe same program in each language is in `sol.c`, `sol.cpp`, `Solution.java` and `sol.py`.\n\n**Traps (each one is caught by the official tests):**\n\n| Mistake | Wrong output |\n|---|---|\n| Both sentences on one line | `Welcome to PUB CSE Fest-26! Code. Compete. Celebrate.` |\n| Missing `!` | `Welcome to PUB CSE Fest-26` |\n| Wrong capitalisation | `welcome to pub cse fest-26!` |\n| `2026` instead of `26` | `Welcome to PUB CSE Fest-2026!` |\n| Submitting the template's `Hello, World!` | `Hello, World!` |\n| Only the first line | (second line missing) |\n| Dropping the full stops | `Code Compete Celebrate` |\n\n**Complexity:** O(1).\n", "zipUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/raw/claude/wizardly-planck-f21sjz/problems/01-welcome/tests.zip", "folderUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/tree/claude/wizardly-planck-f21sjz/problems/01-welcome", "solutions": {"sol.c": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/01-welcome/sol.c", "sol.cpp": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/01-welcome/sol.cpp", "Solution.java": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/01-welcome/Solution.java", "sol.py": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/01-welcome/sol.py"}}, {"num": "02", "slug": "02-fest-tshirts", "name": "Fest T-Shirts", "tier": "Giveaway: arithmetic", "status": "Approved", "fields": [{"name": "Challenge Name", "note": "", "text": "Fest T-Shirts"}, {"name": "Description", "note": "", "text": "Find how many packs of T-shirts the PUB CSE Fest committee must buy, and the total cost."}, {"name": "Problem Statement", "note": "", "text": "PUB CSE Fest-26 is just around the corner! The organizing committee of\nPUB CSE has promised that **everyone** involved in the programming contest\nwill get one fest T-shirt.\n\nThis year there are **N** teams, and every team has exactly **3** members.\nThere are also **V** volunteers and **J** judges. Each contestant, volunteer and\njudge gets exactly one T-shirt.\n\nThe supplier does not sell single T-shirts. T-shirts come only in packs of\n**K**, and each pack costs **C** taka. The committee wants to buy the **minimum\nnumber of packs** so that there is at least one T-shirt for every person\n(leftover T-shirts are fine).\n\nFor each scenario, find the number of packs the committee must buy and the\ntotal cost in taka."}, {"name": "Input Format", "note": "", "text": "The first line contains an integer **T**, the number of scenarios.\n\nEach of the next **T** lines contains five space-separated integers **N V J K C**."}, {"name": "Constraints", "note": "", "text": "- 1 ≤ T ≤ 10⁴\n- 1 ≤ N ≤ 10⁹\n- 0 ≤ V, J ≤ 10⁹\n- 1 ≤ K ≤ 10⁹\n- 1 ≤ C ≤ 10⁹"}, {"name": "Output Format", "note": "", "text": "For each scenario, print one line with two space-separated integers: the minimum\nnumber of packs and the total cost in taka."}, {"name": "Tags", "note": "", "text": "Math, Implementation, Giveaway"}], "testsNote": "- Upload `tests.zip` (8 test cases).\n- Mark **test case 0** as **Sample**.\n- Explanation for test case 0:", "explanation": "- **Scenario 1:** 2 teams have 6 contestants. With 3 volunteers and 2 judges,\n  11 people need T-shirts. Two packs of 5 give only 10 T-shirts, so 3 packs are\n  needed, costing 3 × 120 = 360 taka.\n- **Scenario 2:** 10 teams have 30 contestants, and there are no volunteers or\n  judges. Four packs of 7 give only 28 T-shirts, so 5 packs are needed, costing\n  5 × 450 = 2250 taka.\n- **Scenario 3:** 3 + 1 + 1 = 5 people, and one pack of 5 is exactly enough.", "settings": "- Languages: C, C++, Java, Python 3\n- Time and memory limit: keep HackerRank's defaults (C/C++ 2 s, Java 8 4 s, Python 3 longer).\n  The reference solutions in every language finish each test in under 0.3 s.\n- Scoring: binary (all or nothing)", "tests": [{"id": "00", "source": "file sample.txt", "bytes": 40}, {"id": "01", "source": "gen edge 1", "bytes": 396}, {"id": "02", "source": "gen random 2 10", "bytes": 353}, {"id": "03", "source": "gen random 3 10000", "bytes": 295658}, {"id": "04", "source": "gen divisible 4 10000", "bytes": 332227}, {"id": "05", "source": "gen big 5 10000", "bytes": 438950}, {"id": "06", "source": "gen floatkill 6 10000", "bytes": 424963}, {"id": "07", "source": "gen max 7 10000", "bytes": 460006}], "sampleIn": "3\n2 3 2 5 120\n10 0 0 7 450\n1 1 1 5 1000\n", "sampleOut": "3 360\n5 2250\n1 1000\n", "images": [], "editorial": "# Editorial: Fest T-Shirts (Giveaway)\n\n**Idea.** The number of people is P = 3N + V + J. We need the smallest number of\npacks `x` with `x * K >= P`, which is the ceiling of P / K. The answer is\n`x` and `x * C`.\n\n**Integer ceiling without floating point:** `x = (P + K - 1) / K`.\n\n**Traps (each one is caught by the official tests):**\n\n| Mistake | Why it fails |\n|---|---|\n| Using `int` | P can be up to 5·10⁹, and the cost up to 5·10¹⁸. Use `long long` (C/C++) or `long` (Java). It still fits, since 5·10¹⁸ < 9.22·10¹⁸. |\n| Computing `packs * C` in `int` | Even 3 packs × 10⁹ taka overflows 32-bit. |\n| `P / K` (floor) | It buys too few packs when K does not divide P. |\n| `P / K + 1` | It buys one pack too many when K divides P (Sample 3). |\n| `ceil((float)P / K)` | `float` has only 24 bits of precision. `double` happens to be exact here, but integer arithmetic is the safe habit. |\n| Forgetting that a team has 3 members | Sample 1 already catches this. |\n\n**Complexity:** O(1) per scenario, O(T) overall.\n", "zipUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/raw/claude/wizardly-planck-f21sjz/problems/02-fest-tshirts/tests.zip", "folderUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/tree/claude/wizardly-planck-f21sjz/problems/02-fest-tshirts", "solutions": {"sol.c": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/02-fest-tshirts/sol.c", "sol.cpp": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/02-fest-tshirts/sol.cpp", "Solution.java": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/02-fest-tshirts/Solution.java", "sol.py": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/02-fest-tshirts/sol.py"}}, {"num": "03", "slug": "03-fest-id-checker", "name": "Fest ID Checker", "tier": "Giveaway: strings and conditionals", "status": "Approved", "fields": [{"name": "Challenge Name", "note": "", "text": "Fest ID Checker"}, {"name": "Description", "note": "", "text": "Check whether each contestant ID follows the PUB CSE Fest-26 format CSE-YY-NNNN."}, {"name": "Problem Statement", "note": "", "text": "Every contestant at PUB CSE Fest-26 wears an ID card. Some students typed\ntheir IDs carelessly in the registration form, so the volunteers at the entry\ndesk need a program to check them.\n\nA **valid** ID has the form `CSE-YY-NNNN` and follows **all** of these rules:\n\n1. It is exactly **11** characters long.\n2. The first three characters are `CSE`, in **uppercase**.\n3. The 4th and the 7th characters are both a hyphen `-`.\n4. `YY` (the 5th and 6th characters) are two digits, and together they form the\n   batch year, which must be between **20** and **26** (inclusive).\n5. `NNNN` (the 8th to 11th characters) are four digits, and they are **not** `0000`.\n\nAny ID that breaks at least one rule is **invalid**."}, {"name": "Input Format", "note": "", "text": "The first line contains an integer **T**, the number of IDs.\n\nEach of the next **T** lines contains one ID string **S**."}, {"name": "Constraints", "note": "", "text": "- 1 ≤ T ≤ 1000\n- 1 ≤ length of S ≤ 20\n- S consists of printable ASCII characters and contains **no spaces**."}, {"name": "Output Format", "note": "", "text": "For each ID, print `VALID` if it follows all the rules, otherwise print `INVALID`\n(in uppercase, exactly as shown). Print each answer on its own line."}, {"name": "Tags", "note": "", "text": "Strings, Implementation, Giveaway"}], "testsNote": "- Upload `tests.zip` (6 test cases).\n- Mark **test case 0** as **Sample**.\n- Explanation for test case 0:", "explanation": "- `CSE-26-1042` follows all five rules.\n- `cse-26-1042` is invalid because `CSE` must be uppercase (rule 2).\n- `CSE-19-0420` is invalid because batch 19 is outside 20 to 26 (rule 4).\n- `CSE-24-0000` is invalid because the last four digits are `0000` (rule 5).\n- `CSE-22-12345` has 12 characters (rule 1).\n- `CSE-20-0001` is valid: batch 20 is allowed, and `0001` is not `0000`.", "settings": "- Languages: C, C++, Java, Python 3\n- Time and memory limit: keep HackerRank's defaults (C/C++ 2 s, Java 8 4 s, Python 3 longer).\n  The reference solutions in every language finish each test in under 0.3 s.\n- Scoring: binary (all or nothing)", "tests": [{"id": "00", "source": "file sample.txt", "bytes": 75}, {"id": "01", "source": "gen edge 1", "bytes": 671}, {"id": "02", "source": "gen random 2 20", "bytes": 231}, {"id": "03", "source": "gen random 3 1000", "bytes": 11966}, {"id": "04", "source": "gen random 4 1000", "bytes": 12014}, {"id": "05", "source": "gen valid 5 1000", "bytes": 12005}], "sampleIn": "6\nCSE-26-1042\ncse-26-1042\nCSE-19-0420\nCSE-24-0000\nCSE-22-12345\nCSE-20-0001\n", "sampleOut": "VALID\nINVALID\nINVALID\nINVALID\nINVALID\nVALID\n", "images": [], "editorial": "# Editorial: Fest ID Checker (Giveaway)\n\n**Idea.** Read each ID as a string and check the five rules one by one, in the\norder they are written. Check the **length first**, because every other rule\nuses fixed positions (indices 0 to 10 in 0-based indexing).\n\n```\nlength == 11\ns[0..2] == \"CSE\"\ns[3] == '-' and s[6] == '-'\ns[4], s[5], s[7], s[8], s[9], s[10] are all digits\n20 <= (s[4]-'0')*10 + (s[5]-'0') <= 26\ns[7..10] != \"0000\"\n```\n\n**Traps (each one is caught by the official tests):**\n\n| Mistake | Example that catches it |\n|---|---|\n| Not checking that the length is exactly 11 | `CSE-22-12345` (sample) |\n| Comparing `CSE` case-insensitively | `cse-26-1042` (sample) |\n| Off-by-one on the year range (`<` vs `<=`) | `CSE-19-...`, `CSE-26-...` |\n| Forgetting the `0000` rule | `CSE-24-0000` (sample) |\n| Not checking the hyphens | `CSE_23_1234` |\n| Checking digits only in the serial, not in the year | `CSE-1:-1234`: `':' - '0'` is 10, so the \"year\" becomes 20 and passes the range check |\n| Reading characters past the end of a short string | `C`, `CSE-` (in C/C++ this is undefined behaviour; check the length first) |\n\n**Complexity:** O(|S|) per ID.\n", "zipUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/raw/claude/wizardly-planck-f21sjz/problems/03-fest-id-checker/tests.zip", "folderUrl": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/tree/claude/wizardly-planck-f21sjz/problems/03-fest-id-checker", "solutions": {"sol.c": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/03-fest-id-checker/sol.c", "sol.cpp": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/03-fest-id-checker/sol.cpp", "Solution.java": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/03-fest-id-checker/Solution.java", "sol.py": "https://github.com/ForhanShahriarFahim/pub-cse-fest-26/blob/claude/wizardly-planck-f21sjz/problems/03-fest-id-checker/sol.py"}}, {"num": "04", "slug": "04-lab-robot", "name": "Lab Robot", "tier": "Easy: implementation", "status": "Drafted", "fields": [{"name": "Challenge Name", "note": "", "text": "Lab Robot"}, {"name": "Description", "note": "", "text": "Simulate a robot walking through the contest lab and count the cells it visits."}, {"name": "Problem Statement", "note": "Before you paste: put the cursor on the `![...]` line, click the **image** button\nin the editor toolbar, and upload `sample.png` from this folder. Then delete the\nplaceholder line.", "text": "During PUB CSE Fest-26, the robotics club lends the contest hall a small robot\nnamed **Robu**, which carries water bottles to the teams.\n\nThe contest lab is a grid of **N** rows and **M** columns. Rows are numbered\n1 to N from **top** to **bottom**, and columns 1 to M from **left** to\n**right**. Each cell is one of:\n\n- `.`: free floor\n- `#`: a computer desk, which Robu cannot enter\n- `S`: free floor where Robu starts (there is exactly one `S`)\n\nRobu receives a string of **K** commands, one character each:\n`U` (up one row), `D` (down one row), `L` (left one column), `R` (right one column).\n\nRobu executes the commands **in order**. If a command would move it **outside the\nlab** or **into a desk**, Robu ignores that command and stays where it is, then\ncontinues with the next command.\n\nAfter all commands are done, report:\n\n1. Robu's final position (row and column), and\n2. how many **different** cells Robu has stood on, **including the starting cell**.\n\nThe picture below shows Robu's walk for Sample Input 0, command by command.\n\n![Robu's walk in Sample Input 0](UPLOAD sample.png HERE)"}, {"name": "Input Format", "note": "", "text": "- The first line contains two integers **N** and **M**.\n- Each of the next **N** lines contains a string of **M** characters describing\n  one row of the lab, from row 1 to row N.\n- The next line contains an integer **K**.\n- The last line contains a string of **K** characters, the commands."}, {"name": "Constraints", "note": "", "text": "- 1 ≤ N, M ≤ 100\n- Each grid character is `.`, `#` or `S`, and there is exactly one `S`.\n- 1 ≤ K ≤ 10⁵\n- Each command is `U`, `D`, `L` or `R`."}, {"name": "Output Format", "note": "", "text": "Print two lines:\n\n- The first line contains two integers: Robu's final row and column.\n- The second line contains one integer: the number of different cells Robu has stood on."}, {"name": "Tags", "note": "", "text": "Implementation, Simulation, Grid"}], "testsNote": "- Upload `tests.zip` (13 test cases).\n- Mark **test case 0** as **Sample**.\n- Explanation for test case 0:", "explanation": "Robu starts at (1, 1).\n\n- `U` is ignored, because it would leave the lab.\n- `R R` moves it to (1, 3). The next `R` is ignored, because (1, 4) is a desk.\n- `D D` moves it to (3, 3), and `R R` to (3, 5).\n- `U` moves it to (2, 5), and `D D` moves it back through (3, 5) to (4, 5).\n- The final `L` is ignored, because (4, 4) is a desk.\n\nRobu ends at row 4, column 5. The cells it stood on are (1,1), (1,2), (1,3),\n(2,3), (3,3), (3,4), (3,5), (2,5) and (4,5). That is **9** different cells;\n(3, 5) was visited twice but is counted once.", "settings": "- Languages: C, C++, Java, Python 3\n- Time and memory limit: keep HackerRank's defaults (C/C++ 2 s, Java 8 4 s, Python 3 longer).\n  The reference solutions in every language finish each test in under 0.3 s.\n- Scoring: binary (all or nothing)", "tests": [{"id": "00", "source": "file sample.txt", "bytes": 60}, {"id": "01", "source": "gen one 1 50", "bytes": 60}, {"id": "02", "source": "gen line 2 1 100 1000", "bytes": 1113}, {"id": "03", "source": "gen line 3 100 1 1000", "bytes": 1212}, {"id": "04", "source": "gen boxed 4 10 10 500", "bytes": 621}, {"id": "05", "source": "gen random 5 8 8 60 20", "bytes": 140}, {"id": "06", "source": "gen random 6 30 40 2000 25", "bytes": 3242}, {"id": "07", "source": "gen random 7 100 100 100000 0", "bytes": 110116}, {"id": "08", "source": "gen random 8 100 100 100000 20", "bytes": 110116}, {"id": "09", "source": "gen random 9 100 100 100000 45", "bytes": 110116}, {"id": "10", "source": "gen random 10 100 1 const KIND = { "Challenge Name": "Plain text", "Description": "Plain text", "Tags": "Plain text" };

const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
// Small renderer for the notes in challenge.md: paragraphs and "- " lists with indented continuations.
function prose(md) {
  const out = []; let list = null, para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push("<ul>" + list.map(li => "<li>" + inline(li) + "</li>").join("") + "</ul>"); list = null; } };
  for (const line of md.split("\n")) {
    if (/^- /.test(line)) { flushPara(); (list = list || []).push(line.slice(2)); }
    else if (/^\s+\S/.test(line) && list) { list[list.length - 1] += " " + line.trim(); }
    else if (!line.trim()) { flushPara(); flushList(); }
    else { flushList(); para.push(line.trim()); }
  }
  flushPara(); flushList();
  return out.join("");
}

const copyTexts = [];
function copyBox(text, kind) {
  const id = copyTexts.push(text) - 1;
  return `<div class="box"><div class="bar"><span class="kind">${esc(kind)}</span>` +
    `<button class="copy" type="button" data-copy="${id}">Copy</button></div><pre>${esc(text) || "&nbsp;"}</pre></div>`;
}

document.addEventListener("click", async e => {
  const btn = e.target.closest("button.copy");
  if (!btn) return;
  const text = copyTexts[+btn.dataset.copy];
  const done = msg => { btn.textContent = msg; btn.classList.add("done");
    setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1600); };
  try {
    await navigator.clipboard.writeText(text);
    done("Copied");
  } catch (err) {
    const pre = btn.closest(".box").querySelector("pre");
    const range = document.createRange(); range.selectNodeContents(pre);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
    done(ok ? "Copied" : "Press Ctrl+C");
  }
});

function statusPill(s) { return `<span class="pill ${s === "Approved" ? "ok" : "wait"}">${esc(s)}</span>`; }
function balloon(i) { return `<span class="balloon" style="background:${BALLOONS[i % BALLOONS.length]}" aria-hidden="true"></span>`; }
function kb(n) { return n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`; }

function render(idx) {
  copyTexts.length = 0;
  const p = DATA.problems[idx];
  document.querySelectorAll(".pick").forEach((b, i) => b.setAttribute("aria-current", i === idx ? "true" : "false"));

  const rows = p.fields.map(f => {
    let hint = "";
    if (f.name === "Description") {
      const n = [...f.text].length;
      hint = `<small class="${n > 140 ? "over" : ""}">${n} / 140 characters</small>`;
    }
    const note = f.note ? `<div class="note">${prose(f.note)}</div>` : "";
    return `<div class="row"><div class="label">${esc(f.name)}${hint}</div>` +
      `<div class="field">${note}${copyBox(f.text, KIND[f.name] || "Markdown")}</div></div>`;
  }).join("");

  const testRows = p.tests.map(t => `<tr><td>${t.id}</td><td>${t.id === "00" ? statusPill("Sample") : "Hidden"}</td>` +
    `<td>${kb(t.bytes)}</td><td class="src">${esc(t.source)}</td></tr>`).join("");

  const pics = p.images.length ? `<section class="sect"><h3>Pictures</h3><div class="card">` +
    p.images.map(im => `<figure><img src="${im.data}" alt="${esc(im.name)}"><figcaption><code>${esc(im.name)}</code>: upload it with the editor's image button where the Problem Statement says <code>UPLOAD ${esc(im.name)} HERE</code>. Right-click the picture and choose "Save image as", or get it from the <a href="${p.folderUrl}" target="_blank" rel="noopener">problem folder</a>.</figcaption></figure>`).join("") +
    `</div></section>` : "";

  const sols = Object.entries(p.solutions).map(([f, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(f)}</a>`).join("");

  document.getElementById("main").innerHTML = `
    <section class="phead">
      <div>
        <h2>${balloon(idx)}<span class="no">${p.num}</span> ${esc(p.name)} ${statusPill(p.status)}</h2>
        <div class="tier">${esc(p.tier)}</div>
      </div>
      <div class="actions">
        <a class="btn primary" href="${p.zipUrl}" target="_blank" rel="noopener">Download tests.zip</a>
        <a class="btn" href="${p.folderUrl}" target="_blank" rel="noopener">Problem folder</a>
      </div>
    </section>

    <section class="sect"><h3>Create Challenge form</h3><div class="form">${rows}</div></section>

    <section class="sect"><h3>Test Cases tab</h3>
      <div class="form">
        <div class="row"><div class="label">Steps</div><div class="field prose">${prose(p.testsNote)}</div></div>
        <div class="row"><div class="label">Test cases<small>${p.tests.length} in tests.zip</small></div>
          <div class="field tablewrap"><table><thead><tr><th>#</th><th>Type</th><th>Input size</th><th>How it was made</th></tr></thead><tbody>${testRows}</tbody></table></div></div>
        <div class="row"><div class="label">Sample preview<small>HackerRank should show exactly this</small></div>
          <div class="field split">
            <div class="box"><div class="bar"><span class="kind">Sample Input 0</span></div><pre>${p.sampleIn ? esc(p.sampleIn) : "(empty: this problem has no input)"}</pre></div>
            <div class="box"><div class="bar"><span class="kind">Sample Output 0</span></div><pre>${esc(p.sampleOut)}</pre></div>
          </div></div>
        <div class="row"><div class="label">Explanation<small>for test case 0</small></div><div class="field">${copyBox(p.explanation, "Markdown")}</div></div>
      </div>
    </section>

    <section class="sect"><h3>Settings</h3><div class="card prose">${prose(p.settings)}</div></section>
    ${pics}
    <section class="sect"><h3>For judges</h3><div class="card">
      <p class="prose" style="margin:0 0 10px">Reference solutions (submit one on HackerRank to confirm the setup): </p>
      <div class="links">${sols}</div>
      <details style="margin-top:14px"><summary>Editorial</summary>${copyBox(p.editorial, "Markdown")}</details>
    </div></section>`;
  try { localStorage.setItem("desk-problem", p.num); } catch (_) {}
  if (location.hash !== "#p" + p.num) history.replaceState(null, "", "#p" + p.num);
}

function start() {
  const rail = document.getElementById("rail");
  DATA.problems.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "pick";
    b.innerHTML = `<span class="num">${balloon(i)}${p.num}</span><span class="nm">${esc(p.name)}</span>` +
      `<span class="sub">${esc(p.tier)} · ${esc(p.status)}</span>`;
    b.addEventListener("click", () => { render(i); window.scrollTo({ top: 0 }); });
    rail.appendChild(b);
  });
  document.getElementById("build").innerHTML =
    `${DATA.problems.length} problems · branch <code>${esc(DATA.branch)}</code> · commit <code>${esc(DATA.commit)}</code>`;
  let want = (location.hash.match(/^#p(\d\d)$/) || [])[1];
  if (!want) { try { want = localStorage.getItem("desk-problem"); } catch (_) {} }
  const idx = Math.max(0, DATA.problems.findIndex(p => p.num === want));
  render(idx);
}
start();
</script>
